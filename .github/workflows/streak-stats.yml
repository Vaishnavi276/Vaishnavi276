
name: Update GitHub Streak Stats

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-streak:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate streak statistics
        uses: be-next/github-streak-stats-action@v1
        with:
          username: Vaishnavi276
          token: ${{ secrets.GITHUB_TOKEN }}
          output-path: profile/streak.svg
          theme: tokyonight
          timezone: Asia/Kolkata
          hide-border: true

      - name: Commit updated streak SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add profile/streak.svg

          if ! git diff --cached --quiet; then
            git commit -m "Update GitHub streak statistics"
            git push
          else
            echo "Streak statistics are already up to date."
          fi
